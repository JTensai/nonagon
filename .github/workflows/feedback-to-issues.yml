# Posts each "Request a change" submission from the website as a GitHub issue.
# The daily Claude bot then triages the open "feedback" issues.
name: Feedback to issues
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: feedback-to-issues
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make sure the labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create feedback --color F08C7B --description "Sent from the website" 2>/dev/null || true
      - run: node .github/scripts/feedback-to-issues.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
